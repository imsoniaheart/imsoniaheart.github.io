<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nancy 💗</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Poppins", "Arial", sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#fff0f6,#ffd6e7,#ffeaf3);
    display:flex;
    justify-content:center;
    align-items:center;
    color:#5a3550;
}

.card{
    width:90%;
    max-width:700px;
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(15px);
    border-radius:35px;
    padding:60px 45px;
    text-align:center;
    box-shadow:0 20px 50px rgba(255,120,170,0.25);
    animation:fade 1.2s ease;
}

h1{
    font-size:55px;
    color:#ff6fa8;
    margin-bottom:25px;
}

p{
    font-size:20px;
    line-height:1.8;
    color:#6b4660;
}

.email{
    margin-top:35px;
    font-size:18px;
    color:#ff5c9a;
}

.decor{
    font-size:35px;
    margin-bottom:20px;
}

button{
    margin-top:35px;
    padding:12px 30px;
    border:none;
    border-radius:30px;
    background:#ff8fbd;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
    background:#ff6fa8;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

body.dark{
    background:#3b2635;
}

body.dark .card{
    background:#4b3042;
}

body.dark p{
    color:#ffe1ef;
}

body.dark h1{
    color:#ff9fc8;
}

</style>

</head>

<body>

<div class="card">

<div class="decor">
🎀💗🌸
</div>

<h1>Nancy</h1>

<p>
i am a senior high school student at BJEA and will pursue my undergraduate studies abroad, majoring in Social Science or Psychology.
</p>

<div class="email">
💌 nancycong081031@gmail.com
</div>

<button onclick="toggleMode()">
✨ Pink Mode
</button>

</div>


<script>

function toggleMode(){
    document.body.classList.toggle("dark");
}

</script>

</body>
</html>
